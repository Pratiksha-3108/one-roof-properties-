<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#edf4fb" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#f6f3ea" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#faf8ee" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="28%" r="45%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#faf8ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="archGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1f343f" stroke-width="0.5" stroke-opacity="0.04"/>
    </pattern>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="slateLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f343f" stop-opacity="0.02"/>
      <stop offset="50%" stop-color="#1f343f" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1f343f" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Base architectural luxury gradient -->
  <rect width="1920" height="1080" fill="url(#skyGrad)"/>
  
  <!-- Subtle architectural blueprint grid -->
  <rect width="1920" height="1080" fill="url(#archGrid)"/>

  <!-- Radial Golden Sun Glow behind the 3D Stage -->
  <rect width="1920" height="1080" fill="url(#sunGlow)"/>

  <!-- Flowing Architectural Topographical Contour Elevation Waves -->
  <!-- Upper Waves (Gentle Horizon Waves) -->
  <path d="M-100,140 C320,60 640,210 1020,110 C1400,20 1680,180 2020,90" fill="none" stroke="url(#goldLine)" stroke-width="1.2" stroke-dasharray="8 6"/>
  <path d="M-100,210 C280,130 680,270 1080,180 C1440,90 1720,240 2020,150" fill="none" stroke="url(#slateLine)" stroke-width="1.4"/>
  <path d="M-100,290 C340,210 720,330 1140,240 C1500,160 1760,290 2020,230" fill="none" stroke="url(#goldLine)" stroke-width="1"/>

  <!-- Mid Elevation Contour Curves (Framing the 3D Stage) -->
  <path d="M-100,420 C380,310 760,490 1200,360 C1540,260 1800,410 2020,320" fill="none" stroke="url(#slateLine)" stroke-width="1.5"/>
  <path d="M-100,530 C300,440 700,590 1120,480 C1480,390 1750,520 2020,450" fill="none" stroke="url(#goldLine)" stroke-width="1.8"/>
  <path d="M-100,640 C350,560 740,680 1180,590 C1540,510 1820,620 2020,560" fill="none" stroke="url(#slateLine)" stroke-width="1.2" stroke-dasharray="6 4"/>

  <!-- Lower Waves (Flowing around bottom pills) -->
  <path d="M-100,770 C410,690 800,810 1240,710 C1600,630 1860,760 2020,700" fill="none" stroke="url(#goldLine)" stroke-width="1.6"/>
  <path d="M-100,890 C360,820 780,920 1220,830 C1580,760 1840,880 2020,820" fill="none" stroke="url(#slateLine)" stroke-width="1.4"/>
  <path d="M-100,990 C430,930 840,1020 1280,940 C1640,880 1880,980 2020,930" fill="none" stroke="url(#goldLine)" stroke-width="1.2" stroke-dasharray="10 8"/>

  <!-- Architectural Coordinates & Elevation Compass Marks -->
  <g opacity="0.4" transform="translate(140, 190)">
    <circle cx="0" cy="0" r="28" fill="none" stroke="#d97706" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#d97706" stroke-width="0.5" stroke-dasharray="3 3"/>
    <line x1="-50" y1="0" x2="50" y2="0" stroke="#d97706" stroke-width="0.8"/>
    <line x1="0" y1="-50" x2="0" y2="50" stroke="#d97706" stroke-width="0.8"/>
    <text x="8" y="-12" font-family="sans-serif" font-size="10" font-weight="600" fill="#1f343f" letter-spacing="1">18°39'N 73°44'E</text>
  </g>

  <g opacity="0.35" transform="translate(1760, 240)">
    <circle cx="0" cy="0" r="32" fill="none" stroke="#1f343f" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#d97706" stroke-width="0.5" stroke-dasharray="4 4"/>
    <line x1="-60" y1="0" x2="60" y2="0" stroke="#1f343f" stroke-width="0.8"/>
    <line x1="0" y1="-60" x2="0" y2="60" stroke="#1f343f" stroke-width="0.8"/>
    <text x="-40" y="-14" font-family="sans-serif" font-size="10" font-weight="600" fill="#d97706" letter-spacing="1">ELEV. 570M</text>
  </g>
</svg>